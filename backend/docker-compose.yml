services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chatapp_postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-chatapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chatadmin} -d ${POSTGRES_DB:-chatapp}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: development
    container_name: chatapp_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-chatadmin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatapp}?schema=public'
      PORT: '3000'
      BOT_MODE: '${BOT_MODE:-false}'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
